<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>배전망 위험 지도</title>
    <meta name="description" content="변압기 용량 대비 부하 기반 전국 시·군·구 배전망 우선점검 지도" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" type="image/svg+xml" href="/grid-risk-map/favicon.svg" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("grid-theme");
          if (t !== "dark" && t !== "light")
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          if (t === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/grid-risk-map/assets/spa-index-oimY_m4q.js"></script>
    <link rel="stylesheet" crossorigin href="/grid-risk-map/assets/styles-DAPDUg6z.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
